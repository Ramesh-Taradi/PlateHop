spring.application.name=PlateHop
server.port=${PORT:8081}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/platehop_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Spring MVC JSP View Resolver
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,file:src/main/webapp/